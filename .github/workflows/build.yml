name: Build Talos
on:
  push:
    branches: [main, release/production]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare extension build tools
        run: command -v cmake || brew install cmake
      - uses: actions/cache@v5
        with:
          path: built-in-actions/vendor
          key: extension-codecs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('built-in-actions/scripts/build-tools.sh') }}
      - name: Build and run real app flows
        run: |
          xcodebuild -version
          xcodebuild test -project Talos.xcodeproj -scheme Talos \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build/tests -resultBundlePath build/TalosFlows.xcresult \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
      - name: Verify bundled actions and languages in the app
        run: python3 scripts/check-bundled-actions.py build/tests/Build/Products/Debug/Talos.app
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: talos-ui-results
          path: build/TalosFlows.xcresult
          if-no-files-found: warn
  package:
    needs: test
    if: github.ref == 'refs/heads/release/production' && github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare extension build tools
        run: command -v cmake || brew install cmake
      - uses: actions/cache@v5
        with:
          path: built-in-actions/vendor
          key: extension-codecs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('built-in-actions/scripts/build-tools.sh') }}
      - name: Prepare release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > build/releases.json
          python3 <<'PYTHON'
          import json, os, re
          from pathlib import Path
          versions = set(re.findall(r'MARKETING_VERSION = ([^;]+);', Path('Talos.xcodeproj/project.pbxproj').read_text()))
          if len(versions) != 1:
              raise SystemExit(f'Expected one consistent MARKETING_VERSION, found: {versions}')
          version = versions.pop()
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?', version):
              raise SystemExit('MARKETING_VERSION must be MAJOR.MINOR or MAJOR.MINOR.PATCH')
          tag = f'v{version}'
          current = tuple(map(int, version.split('.')))
          current += (0,) * (3 - len(current))
          for release in json.loads(Path('build/releases.json').read_text()):
              if release['draft'] or release['prerelease']:
                  continue
              previous = release['tag_name']
              if re.fullmatch(r'v[0-9]+\.[0-9]+(?:\.[0-9]+)?', previous):
                  previous_version = tuple(map(int, previous[1:].split('.')))
                  previous_version += (0,) * (3 - len(previous_version))
                  if current <= previous_version:
                      raise SystemExit(f'{tag} must be newer than published release {previous}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'tag={tag}\n')
          PYTHON
      - name: Import signing credentials
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in CERT_P12 CERT_PASSWORD ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::Missing signing secret: $name"; exit 1; }
          done
          umask 077
          signing_keychain="$RUNNER_TEMP/talos-signing.keychain-db"
          signing_password="$(openssl rand -base64 32)"
          echo "::add-mask::$signing_password"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/talos-cert.p12"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/talos-asc.p8"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/talos-cert.p12" -P "$CERT_PASSWORD" -t cert -f pkcs12 \
            -k "$signing_keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$signing_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/talos-cert.p12"
      - name: Archive with Developer ID
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive -project Talos.xcodeproj -scheme Talos -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/Talos.xcarchive \
            -derivedDataPath build/release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Developer ID Application' \
            DEVELOPMENT_TEAM=U6WA8YA735 \
            PROVISIONING_PROFILE_SPECIFIER='' CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$APP_VERSION"
      - name: Export for distribution
        run: |
          xcodebuild -exportArchive -archivePath build/Talos.xcarchive \
            -exportPath build/export -exportOptionsPlist Configuration/ExportOptions.plist
      - name: Verify bundled actions and languages in the release
        run: python3 scripts/check-bundled-actions.py build/export/Talos.app
      - name: Notarize and package app
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app_path="$PWD/build/export/Talos.app"
          codesign --verify --deep --strict "$app_path"
          # Notarize the executable payload explicitly: .talos is an opaque extension to Gatekeeper.
          for archive in "$app_path"/Contents/Resources/BundledExtensions/*.talos; do
            cp "$archive" build/extension-notarize.zip
            xcrun notarytool submit build/extension-notarize.zip --key "$RUNNER_TEMP/talos-asc.p8" \
              --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --wait \
              --output-format json > build/extension-notarization.json
            cat build/extension-notarization.json
            extension_submission="$(python3 -c 'import json; print(json.load(open("build/extension-notarization.json"))["id"])')"
            xcrun notarytool log "$extension_submission" --key "$RUNNER_TEMP/talos-asc.p8" \
              --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" build/extension-notarization-log.json
            cat build/extension-notarization-log.json
            python3 -c 'import json; result = json.load(open("build/extension-notarization.json")); assert result["status"] == "Accepted", result'
          done
          ditto -c -k --keepParent "$app_path" build/notarize.zip
          xcrun notarytool submit build/notarize.zip --key "$RUNNER_TEMP/talos-asc.p8" \
            --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --wait \
            --output-format json > build/notarization.json
          cat build/notarization.json
          submission_id="$(python3 -c 'import json; print(json.load(open("build/notarization.json"))["id"])')"
          xcrun notarytool log "$submission_id" --key "$RUNNER_TEMP/talos-asc.p8" \
            --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" build/notarization-log.json
          cat build/notarization-log.json
          python3 -c 'import json; result = json.load(open("build/notarization.json")); assert result["status"] == "Accepted", result'
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute "$app_path"
          mkdir -p build/distribution build/dmg
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/distribution/Talos.zip
          ditto "$app_path" build/dmg/Talos.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Talos -srcfolder build/dmg -ov -format UDZO build/distribution/Talos.dmg
          cd build/distribution
          shasum -a 256 Talos.zip Talos.dmg > SHA256SUMS
      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY" || { echo '::error::Missing SPARKLE_PRIVATE_KEY'; exit 1; }
          mkdir -p build/appcast
          cp build/distribution/Talos.zip build/appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            build/release/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - --maximum-deltas 0 \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              -o build/distribution/appcast.xml build/appcast
          swift scripts/verify-appcast.swift build/distribution/appcast.xml \
            build/distribution/Talos.zip build/export/Talos.app/Contents/Info.plist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Talos.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo '::error::Release tag already points to a different commit'; exit 1;
            }
          else
            git tag -a "$RELEASE_TAG" -m "Talos $APP_VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > build/release-is-draft.txt 2>/dev/null; then
            test "$(cat build/release-is-draft.txt)" = true || { echo '::error::Published releases cannot be replaced'; exit 1; }
          else
            printf 'Talos %s for macOS 27 or later.\n\nDownload Talos.dmg or Talos.zip below. Both contain the Developer ID signed and notarized app.\n' "$APP_VERSION" > build/release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Talos $APP_VERSION" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/distribution/Talos.zip \
            build/distribution/Talos.dmg --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Commit Pages update feed and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cp build/distribution/appcast.xml docs/appcast.xml
          cp build/distribution/SHA256SUMS docs/SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/appcast.xml docs/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "release: publish $RELEASE_TAG feed and checksums"
            git push origin HEAD:release/production
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: talos-macOS-${{ github.run_number }}
          path: build/distribution/
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/talos-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/talos-cert.p12" "$RUNNER_TEMP/talos-asc.p8"

name: Publish appcast to GitHub Pages
on:
  public:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Talos]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      !github.event.repository.private &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'release/production' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/production
      - name: Prepare site from release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp docs/index.html docs/appcast.xml docs/SHA256SUMS _site/
          touch _site/.nojekyll
          python3 <<'PYTHON'
          import os, re, urllib.request, xml.etree.ElementTree as ET
          feed = ET.parse('_site/appcast.xml')
          enclosure = feed.find('./channel/item/enclosure')
          assert enclosure is not None, 'The release branch has no update entry'
          url = enclosure.attrib['url']
          assert url.startswith(f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/")
          checksums = open('_site/SHA256SUMS', encoding='utf-8').read().splitlines()
          assert len(checksums) == 2, 'Expected checksums for the ZIP and DMG'
          names = set()
          for line in checksums:
              match = re.fullmatch(r'[0-9a-f]{64}  (Talos\.zip|Talos\.dmg)', line)
              assert match, f'Invalid checksum line: {line}'
              names.add(match[1])
          assert names == {'Talos.zip', 'Talos.dmg'}
          request = urllib.request.Request(url, method='HEAD')
          with urllib.request.urlopen(request) as response:
              assert response.status == 200, 'The update must be downloadable without authentication'
          PYTHON
      - name: Check Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null || {
            echo '::error::Enable Settings → Pages → Source: GitHub Actions, then rerun this workflow.'
            exit 1
          }
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy appcast
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live appcast
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "${PAGE_URL}appcast.xml?run=${GITHUB_RUN_ID}" --output /tmp/appcast.xml
          cmp _site/appcast.xml /tmp/appcast.xml
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "${PAGE_URL}SHA256SUMS?run=${GITHUB_RUN_ID}" --output /tmp/SHA256SUMS
          cmp _site/SHA256SUMS /tmp/SHA256SUMS
